databases:
  - name: plume-db
    plan: free

services:
  - type: web
    name: plume
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: plume-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.6"
